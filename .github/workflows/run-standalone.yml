name: Hasad Views Standalone
run-name: Hasad Views standalone (${{ github.run_id }})
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: hasad-views
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Stop if automation is paused
        run: |
          if [ -f state/automation_paused ]; then
            echo "Automation is paused; manual re-enable is required."
            exit 1
          fi
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies and Xvfb
        run: |
          pip install requests playwright
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run script directly without Supabase
        env:
          SITE_USERNAME_1: ${{ secrets.SITE_USERNAME_1 }}
          SITE_PASSWORD_1: ${{ secrets.SITE_PASSWORD_1 }}
          SITE_USERNAME_2: ${{ secrets.SITE_USERNAME_2 }}
          SITE_PASSWORD_2: ${{ secrets.SITE_PASSWORD_2 }}
          SITE_USERNAME_3: ${{ secrets.SITE_USERNAME_3 }}
          SITE_PASSWORD_3: ${{ secrets.SITE_PASSWORD_3 }}
          SITE_USERNAME_4: ${{ secrets.SITE_USERNAME_4 }}
          SITE_PASSWORD_4: ${{ secrets.SITE_PASSWORD_4 }}
          SITE_USERNAME_5: ${{ secrets.SITE_USERNAME_5 }}
          SITE_PASSWORD_5: ${{ secrets.SITE_PASSWORD_5 }}
          SITE_USERNAME_6: ${{ secrets.SITE_USERNAME_6 }}
          SITE_PASSWORD_6: ${{ secrets.SITE_PASSWORD_6 }}
          SITE_USERNAME_7: ${{ secrets.SITE_USERNAME_7 }}
          SITE_PASSWORD_7: ${{ secrets.SITE_PASSWORD_7 }}
          SITE_USERNAME_8: ${{ secrets.SITE_USERNAME_8 }}
          SITE_PASSWORD_8: ${{ secrets.SITE_PASSWORD_8 }}
          SITE_USERNAME_9: ${{ secrets.SITE_USERNAME_9 }}
          SITE_PASSWORD_9: ${{ secrets.SITE_PASSWORD_9 }}
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" python main.py
      - name: Pause workflows after account failure
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f state/automation_paused ]; then
            gh workflow disable run.yml --repo "$GITHUB_REPOSITORY" || true
            gh workflow disable run-standalone.yml --repo "$GITHUB_REPOSITORY" || true
            echo "Publishing workflows disabled after account/login/balance failure."
            exit 1
          fi
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update state from standalone run"
          git pull --rebase origin main
          git push origin HEAD:main
