name: Hasad Views - Manual Link Retry

on:
  workflow_dispatch:
    inputs:
      link:
        description: "إعادة الرابط بعد قراءة العداد؛ الطلبات والكميات تخضع لسقف 10,400"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: hasad-views
  cancel-in-progress: false

jobs:
  retry-one-link:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest state
        run: |
          git fetch origin main
          git reset --hard FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium
      - name: Retry selected link
        env:
          SITE_USERNAME_1: ${{ secrets.SITE_USERNAME_1 }}
          SITE_PASSWORD_1: ${{ secrets.SITE_PASSWORD_1 }}
          SITE_USERNAME_2: ${{ secrets.SITE_USERNAME_2 }}
          SITE_PASSWORD_2: ${{ secrets.SITE_PASSWORD_2 }}
          SITE_USERNAME_3: ${{ secrets.SITE_USERNAME_3 }}
          SITE_PASSWORD_3: ${{ secrets.SITE_PASSWORD_3 }}
          SITE_USERNAME_4: ${{ secrets.SITE_USERNAME_4 }}
          SITE_PASSWORD_4: ${{ secrets.SITE_PASSWORD_4 }}
          SITE_USERNAME_5: ${{ secrets.SITE_USERNAME_5 }}
          SITE_PASSWORD_5: ${{ secrets.SITE_PASSWORD_5 }}
          SITE_USERNAME_6: ${{ secrets.SITE_USERNAME_6 }}
          SITE_PASSWORD_6: ${{ secrets.SITE_PASSWORD_6 }}
          SITE_USERNAME_7: ${{ secrets.SITE_USERNAME_7 }}
          SITE_PASSWORD_7: ${{ secrets.SITE_PASSWORD_7 }}
          SITE_USERNAME_8: ${{ secrets.SITE_USERNAME_8 }}
          SITE_PASSWORD_8: ${{ secrets.SITE_PASSWORD_8 }}
          SITE_USERNAME_9: ${{ secrets.SITE_USERNAME_9 }}
          SITE_PASSWORD_9: ${{ secrets.SITE_PASSWORD_9 }}
          SITE_USERNAME_10: ${{ secrets.SITE_USERNAME_10 }}
          SITE_PASSWORD_10: ${{ secrets.SITE_PASSWORD_10 }}
          SITE_USERNAME_11: ${{ secrets.SITE_USERNAME_11 }}
          SITE_PASSWORD_11: ${{ secrets.SITE_PASSWORD_11 }}
          SITE_USERNAME_12: ${{ secrets.SITE_USERNAME_12 }}
          SITE_PASSWORD_12: ${{ secrets.SITE_PASSWORD_12 }}
          SITE_USERNAME_13: ${{ secrets.SITE_USERNAME_13 }}
          SITE_PASSWORD_13: ${{ secrets.SITE_PASSWORD_13 }}
          SITE_USERNAME_14: ${{ secrets.SITE_USERNAME_14 }}
          SITE_PASSWORD_14: ${{ secrets.SITE_PASSWORD_14 }}
          SITE_USERNAME_15: ${{ secrets.SITE_USERNAME_15 }}
          SITE_PASSWORD_15: ${{ secrets.SITE_PASSWORD_15 }}
          SITE_USERNAME_16: ${{ secrets.SITE_USERNAME_16 }}
          SITE_PASSWORD_16: ${{ secrets.SITE_PASSWORD_16 }}
          SITE_USERNAME_17: ${{ secrets.SITE_USERNAME_17 }}
          SITE_PASSWORD_17: ${{ secrets.SITE_PASSWORD_17 }}
          SITE_USERNAME_18: ${{ secrets.SITE_USERNAME_18 }}
          SITE_PASSWORD_18: ${{ secrets.SITE_PASSWORD_18 }}
          SITE_USERNAME_19: ${{ secrets.SITE_USERNAME_19 }}
          SITE_PASSWORD_19: ${{ secrets.SITE_PASSWORD_19 }}
          SITE_USERNAME_20: ${{ secrets.SITE_USERNAME_20 }}
          SITE_PASSWORD_20: ${{ secrets.SITE_PASSWORD_20 }}
          SITE_USERNAME_21: ${{ secrets.SITE_USERNAME_21 }}
          SITE_PASSWORD_21: ${{ secrets.SITE_PASSWORD_21 }}
          SITE_USERNAME_22: ${{ secrets.SITE_USERNAME_22 }}
          SITE_PASSWORD_22: ${{ secrets.SITE_PASSWORD_22 }}
          SITE_USERNAME_23: ${{ secrets.SITE_USERNAME_23 }}
          SITE_PASSWORD_23: ${{ secrets.SITE_PASSWORD_23 }}
          SITE_USERNAME_24: ${{ secrets.SITE_USERNAME_24 }}
          SITE_PASSWORD_24: ${{ secrets.SITE_PASSWORD_24 }}
          SITE_USERNAME_25: ${{ secrets.SITE_USERNAME_25 }}
          SITE_PASSWORD_25: ${{ secrets.SITE_PASSWORD_25 }}
          SITE_USERNAME_26: ${{ secrets.SITE_USERNAME_26 }}
          SITE_PASSWORD_26: ${{ secrets.SITE_PASSWORD_26 }}
          SITE_USERNAME_27: ${{ secrets.SITE_USERNAME_27 }}
          SITE_PASSWORD_27: ${{ secrets.SITE_PASSWORD_27 }}
          SITE_USERNAME_28: ${{ secrets.SITE_USERNAME_28 }}
          SITE_PASSWORD_28: ${{ secrets.SITE_PASSWORD_28 }}
          SITE_USERNAME_29: ${{ secrets.SITE_USERNAME_29 }}
          SITE_PASSWORD_29: ${{ secrets.SITE_PASSWORD_29 }}
          SITE_USERNAME_30: ${{ secrets.SITE_USERNAME_30 }}
          SITE_PASSWORD_30: ${{ secrets.SITE_PASSWORD_30 }}
          TARGET_LINK: ${{ inputs.link }}
        run: python retry_link.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update state after manual retry"
          git pull --rebase
          git push
