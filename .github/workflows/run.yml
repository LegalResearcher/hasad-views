name: Hasad Views

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hasad-views
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest state
        run: |
          git fetch origin main
          git reset --hard FETCH_HEAD

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Run script
        env:
          SITE_USERNAME_1: ${{ secrets.SITE_USERNAME_1 }}
          SITE_PASSWORD_1: ${{ secrets.SITE_PASSWORD_1 }}
          SITE_USERNAME_2: ${{ secrets.SITE_USERNAME_2 }}
          SITE_PASSWORD_2: ${{ secrets.SITE_PASSWORD_2 }}
          SITE_USERNAME_3: ${{ secrets.SITE_USERNAME_3 }}
          SITE_PASSWORD_3: ${{ secrets.SITE_PASSWORD_3 }}
          SITE_USERNAME_4: ${{ secrets.SITE_USERNAME_4 }}
          SITE_PASSWORD_4: ${{ secrets.SITE_PASSWORD_4 }}
          SITE_USERNAME_5: ${{ secrets.SITE_USERNAME_5 }}
          SITE_PASSWORD_5: ${{ secrets.SITE_PASSWORD_5 }}
          SITE_USERNAME_6: ${{ secrets.SITE_USERNAME_6 }}
          SITE_PASSWORD_6: ${{ secrets.SITE_PASSWORD_6 }}
          SITE_USERNAME_7: ${{ secrets.SITE_USERNAME_7 }}
          SITE_PASSWORD_7: ${{ secrets.SITE_PASSWORD_7 }}
          SITE_USERNAME_8: ${{ secrets.SITE_USERNAME_8 }}
          SITE_PASSWORD_8: ${{ secrets.SITE_PASSWORD_8 }}
          SITE_USERNAME_9: ${{ secrets.SITE_USERNAME_9 }}
          SITE_PASSWORD_9: ${{ secrets.SITE_PASSWORD_9 }}
          SITE_USERNAME_10: ${{ secrets.SITE_USERNAME_10 }}
          SITE_PASSWORD_10: ${{ secrets.SITE_PASSWORD_10 }}
          SITE_USERNAME_11: ${{ secrets.SITE_USERNAME_11 }}
          SITE_PASSWORD_11: ${{ secrets.SITE_PASSWORD_11 }}
        run: python main.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update state"
          git pull --rebase
          git push
